version: '3.8'

services:
  # =========================================================
  # 1. SERVICE DE LA BASE DE DONNÉES (POSTGRES)
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      # --- INFORMATIONS DE L'UTILISATEUR CRÉÉ ---
      - POSTGRES_USER=n8n_user
      - POSTGRES_PASSWORD=votre_mot_de_passe_secret
      - POSTGRES_DB=n8n_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # =========================================================
  # 2. SERVICE N8N
  # =========================================================
  n8n:
    image: n8nio/n8n
    container_name: n8n_workflow
    restart: always
    ports:
      - "5679:5678" # 👈 On continue d'utiliser le contournement de port
    environment:
      # ==================================================================
      # ** PLACEZ ICI TOUTES LES VARIABLES DU .env (Déjà listées) **
      N8N_ENABLED_MODULES: instance-ai
      N8N_INSTANCE_AI_MODEL: ${N8N_INSTANCE_AI_MODEL}
      N8N_INSTANCE_AI_MODEL_API_KEY: ${N8N_INSTANCE_AI_MODEL_API_KEY}
      N8N_INSTANCE_AI_SANDBOX_ENABLED: ${N8N_INSTANCE_AI_SANDBOX_ENABLED}
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: ${N8N_INSTANCE_AI_SANDBOX_PROVIDER}
      
      # --- CONFIGURATION DE LA BASE DE DONNÉES ---
      - DB_TYPE=postgresdb
      - DB_POSTGRES_HOST=postgres
      - DB_POSTGRES_PORT=5432
      - DB_POSTGRES_USER=n8n_user
      - DB_POSTGRES_PASSWORD=votre_mot_de_passe_secret
      - DB_POSTGRES_DATABASE=n8n_db
      
      # --- CONFIGURATION WEB ET ADRESSE ---
      - WEBHOOK_URL=https://n8n.rennesdev.fr
      - N8N_HOST=n8n.rennesdev.fr
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/n8n/.n8n

# =========================================================
# 3. SERVICES DE L'ASSISTANT IA (THE SANDBOX PILE)
# =========================================================
# --- 3A. Certificats ---
sandbox-certs:
    image: ghcr.io/n8nio/n8n-sandbox-service-certs:latest
    user: '0:0'
    entrypoint: ['sh', '-c']
    command: >
      bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api --control-san sandbox-runner
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - sandbox-tls:/tls

# --- 3B. API Sandbox (Le contrôleur de l'IA) ---
sandbox-api:
    image: ghcr.io/n8nio/n8n-sandbox-service-api:latest
    depends_on:
      - sandbox-certs
    environment:
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY}
    volumes:
      - sandbox-tls:/tls

# --- 3C. Sandbox Runner (Le moteur d'exécution de code) ---
sandbox-runner-1:
    image: ghcr.io/n8nio/n8n-sandbox-service-runner-dind:latest
    privileged: true # Nécessaire pour l'exécution de code Docker-in-Docker
    depends_on:
      - sandbox-api
    environment:
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_API_RUNNER_API_KEY}
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: http://sandbox-runner-1:8080
      # ... (toutes les autres variables de secrets de runner)
    volumes:
      - sandbox-tls:/tls

# --- 3D. Recherche Web (SearxNG) ---
searxng:
    image: ghcr.io/searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro

# =========================================================
# 4. DÉFINITION DES VOLUMES DE PERSISTANCE
# =========================================================
volumes:
  postgres_data:
  n8n_data:
  sandbox-tls: # Volume pour les certificats TLS
